/* 2026 UI refinement: quiet editorial hierarchy, responsive surfaces, accessible controls */
:root{
 color-scheme:dark;
 --ui-bg:#090b10;
 --ui-surface:rgba(20,23,31,.68);
 --ui-line:rgba(224,230,242,.13);
 --ui-line-strong:rgba(224,230,242,.24);
 --ui-text:#f0f2f7;
 --ui-muted:#a0a8b7;
 --ui-soft:#737d8d;

 --ui-ease:cubic-bezier(.2,.75,.25,1);
}
html{min-height:100%;background:var(--ui-bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100svh;background:var(--ui-bg);color:var(--ui-text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid rgba(213,196,224,.9);outline-offset:4px}
.screen{height:100vh;height:100dvh;min-height:100svh}
#home{
 overflow-y:auto;overscroll-behavior:contain;
 align-items:center;justify-content:center;
 padding:max(30px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
 background:
  radial-gradient(ellipse at 50% 8%,rgba(105,112,145,.19),transparent 42%),
  radial-gradient(ellipse at 12% 86%,rgba(100,82,119,.10),transparent 34%),
  linear-gradient(160deg,#11141d 0%,#0b0d13 52%,#080a0f 100%);
}
.home-inner{width:min(100%,620px);max-height:none;overflow:visible;padding:clamp(18px,5vh,54px) 0}
.eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 25px;color:#a9aebe;font-size:10px;letter-spacing:.22em}
.eyebrow:before{content:"";width:24px;height:1px;background:linear-gradient(90deg,#c7b3d0,transparent);opacity:.8}

.spaces{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.space{
 isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;
 min-height:clamp(145px,24vh,205px);padding:20px;
 border:1px solid var(--ui-line);border-radius:var(--ui-radius);
 background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018) 58%,rgba(255,255,255,.012));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 14px 34px rgba(0,0,0,.14);
 text-align:left;transition:transform .45s var(--ui-ease),border-color .35s ease,background .35s ease,box-shadow .35s ease;
}
.space:before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(ellipse at 88% 10%,var(--glow),transparent 62%);opacity:.16;transition:opacity .4s ease}

>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>

function initSolitudeThree(){

  const glow=new T.Mesh(new T.SphereGeometry(.075,12,8),new T.MeshBasicMaterial({color:0xc9b8cc,transparent:true,opacity:.55}));glow.position.set(0,1.45,-10);scene.add(glow);
  const glowLight=new T.PointLight(0xa9a0bd,7,7,2);glowLight.position.copy(glow.position);scene.add(glowLight);

    new T.Vector3(1.42,-.02,-7.2)

function categoryScores(key){const all=readAdaptation();return all[key]||{presence:0,support:0,reflection:0}}
function learnFromVisit(){if(!current||!itemStartedAt)return;const item=current.items[index],elapsed=(Date.now()-itemStartedAt)/1000,category=item[2];if(!category)return;const all=readAdaptation(),scores=all[current.key]||{presence:0,support:0,reflection:0};let delta=elapsed>=14?0.45:elapsed>=7?0.15:elapsed<3?-0.08:0;scores[category]=Math.max(-1.5,Math.min(2.5,(scores[category]||0)+delta));all[current.key]=scores;writeAdaptation(all);itemStartedAt=0}

}
function render(){if(current&&current.key==="loneliness"){startSolitudeAtmosphere();startSolitudeThree();}const progress=document.querySelector("#feed-progress");if(progress){progress.hidden=current.key==="loneliness";if(!progress.hidden){progress.textContent=String(index+1).padStart(2,"0")+" / "+String(current.items.length).padStart(2,"0");progress.style.setProperty("--progress",(((index+1)/current.items.length)*100)+"%");progress.setAttribute("role","progressbar");progress.setAttribute("aria-label","Прогресс пространства");progress.setAttribute("aria-valuemin","1");progress.setAttribute("aria-valuemax",String(current.items.length));progress.setAttribute("aria-valuenow",String(index+1));}}if(current&&["anxiety","emptiness","sadness"].includes(current.key)){const phase=Math.min(4,Math.floor(index/current.items.length*4)+1);feed.classList.add("inner-space");feed.dataset.phase=current.key+"-"+phase;document.querySelector("#world-painting").dataset.artPhase=current.key+"-"+phase;document.querySelector("#world-mark").textContent=({anxiety:"НАПРЯЖЕНИЕ",emptiness:"ПРОСТРАНСТВО ТИШИНЫ",sadness:"СЛЕД ЧУВСТВА"})[current.key]+"  ·  "+String(index+1).padStart(2,"0")+" / "+String(current.items.length).padStart(2,"0");}if(current&&current.key==="loneliness"){feed.classList.remove("inner-space");const s=jungStory[index];feed.dataset.phase=s.symbol;document.querySelector("#world-mark").textContent=s.chapter+"  ·  "+String(index+1).padStart(2,"0")+" / "+String(jungStory.length).padStart(2,"0");const sourceLink=document.querySelector("#video-source-link");sourceLink.removeAttribute("href");sourceLink.classList.remove("visible");const solitudePhotos=["5933191","14874383","32960953","39972076","25237316","8860203","19602602","15113466"];const photoId=solitudePhotos[index]||solitudePhotos[0];scene.style.backgroundImage='linear-gradient(180deg,#08091022 0%,#08091030 38%,#080910d9 100%),url("https://images.pexels.com/photos/'+photoId+'/pexels-photo-'+photoId+'.jpeg?auto=compress&cs=tinysrgb&w=1600")';scene.style.backgroundSize="cover";scene.style.backgroundPosition="center";playSolitudeVideo(s);depthPanel.classList.remove("visible");depthYes.hidden=false;depthYes.textContent="Оставить здесь";msg.classList.add("is-changing");sub.classList.add("is-changing");window.setTimeout(()=>{if(!current||current.key!=="loneliness")return;msg.textContent=s.text;sub.textContent=s.sub;requestAnimationFrame(()=>requestAnimationFrame(()=>{msg.classList.remove("is-changing");sub.classList.remove("is-changing")}));},260);depthCopy.textContent=s.question+"\n\n"+s.pause;itemStartedAt=Date.now();return;}const item=current.items[index];depthPanel.classList.remove("visible");depthYes.hidden=false;msg.classList.add("is-changing");sub.classList.add("is-changing");window.setTimeout(()=>{if(!current)return;msg.textContent=item[0];sub.textContent=item[1];requestAnimationFrame(()=>requestAnimationFrame(()=>{msg.classList.remove("is-changing");sub.classList.remove("is-changing")}));},170);itemStartedAt=Date.now();lastCategory=item[2];depthCopy.textContent=deeper[current.key][index];if(!shown.includes(index))shown.push(index)}

function skipUnavailableVideo(key,token){
  if(token!==videoLoadToken||!current||current.key!==key)return;
  if(videoLoadTimer){clearTimeout(videoLoadTimer);videoLoadTimer=null;}
  failedVideoAttempts[key]=(failedVideoAttempts[key]||0)+1;
  if(failedVideoAttempts[key]<data[key].videos.length){
    drawVideo(key);
  }else{
    video.classList.remove("is-loading");
    
  }
}
async function resolvePlayableVideo(url){
  if(url.includes("videos.pexels.com/video-files/"))return url;
  const file=decodeURIComponent(url.substring(url.lastIndexOf("/")+1));
  const api=new URL("https://commons.wikimedia.org/w/api.php");
  api.search=new URLSearchParams({action:"query",titles:"File:"+file,prop:"videoinfo",viprop:"derivatives",format:"json",origin:"*"}).toString();
  try{
    const response=await fetch(api.toString(),{mode:"cors"});
    if(!response.ok)throw new Error("Commons API unavailable");
    const json=await response.json();
    const page=Object.values(json.query.pages)[0];
    const derivatives=page&&page.videoinfo&&page.videoinfo[0]&&page.videoinfo[0].derivatives||[];
    const preferred=["480p.vp9.webm","360p.vp9.webm","240p.vp9.webm","480p.webm","360p.webm","240p.webm"];
    for(const key of preferred){
      const source=derivatives.find(item=>item.transcodekey===key&&item.src);
      if(source)return source.src;
    }
  }catch(e){}
  return url;
}
async function drawVideo(key){
  
  if(videoLoadTimer){clearTimeout(videoLoadTimer);videoLoadTimer=null;}
  const token=++videoLoadToken;
  const list=data[key].videos;
  let deck=videoDecks[key];
  if(!deck||deck.length===0){
    deck=list.map((url,i)=>i);
  }
  const chosen=deck.shift();
  videoDecks[key]=deck;
  lastVideoBySpace[key]=chosen;
  const originalUrl=list[chosen];
  const file=decodeURIComponent(originalUrl.substring(originalUrl.lastIndexOf("/")+1));
  video.classList.add("is-loading");
  video.pause();
  video.removeAttribute("src");
  video.load();
  videoLoadTimer=setTimeout(()=>skipUnavailableVideo(key,token),22000);
  const playableUrl=await resolvePlayableVideo(originalUrl);
  if(token!==videoLoadToken||!current||current.key!==key)return;
  video.src=playableUrl;
  video.load();
  const playResult=video.play();
  if(playResult&&typeof playResult.catch==="function")playResult.catch(()=>{});
}
