let current=null,index=0,startY=0,lastTap=0,shown=[],itemStartedAt=0,lastCategory=null;const videoDecks={},lastVideoBySpace={};let videoLoadTimer=null,videoLoadToken=0,failedVideoAttempts={};
const home=document.querySelector("#home"),feed=document.querySelector("#feed"),scene=document.querySelector("#scene"),video=document.querySelector("#scene-video"),msg=document.querySelector("#message"),sub=document.querySelector("#submessage"),soundButton=document.querySelector("#sound-toggle"),depthPanel=document.querySelector("#depth-panel"),depthCopy=document.querySelector("#depth-copy"),depthYes=document.querySelector("#depth-yes"),depthClose=document.querySelector("#depth-close");
const ADAPT_KEY="tishe_content_rhythm_v1";
function readAdaptation(){try{return JSON.parse(localStorage.getItem(ADAPT_KEY)||"{}")}catch(e){return {}}}
function writeAdaptation(value){try{localStorage.setItem(ADAPT_KEY,JSON.stringify(value))}catch(e){}}
function categoryScores(key){const all=readAdaptation();return all[key]||{presence:0,support:0,reflection:0}}
function learnFromVisit(){if(!current||!itemStartedAt)return;const item=current.items[index],elapsed=(Date.now()-itemStartedAt)/1000,category=item[2];if(!category)return;const all=readAdaptation(),scores=all[current.key]||{presence:0,support:0,reflection:0};let delta=elapsed>=14?0.45:elapsed>=7?0.15:elapsed<3?-0.08:0;scores[category]=Math.max(-1.5,Math.min(2.5,(scores[category]||0)+delta));all[current.key]=scores;writeAdaptation(all);itemStartedAt=0}
function chooseNext(){const remaining=current.items.map((item,i)=>({item,i})).filter(x=>!shown.includes(x.i));if(!remaining.length){shown=[];return chooseNext()}const scores=categoryScores(current.key);remaining.sort((a,b)=>{const score=x=>(scores[x.item[2]]||0)+(x.item[2]===lastCategory?-0.55:0)-(x.i/1000);return score(b)-score(a)});return remaining[0].i}
function render(){const item=current.items[index];depthPanel.classList.remove("visible");depthYes.hidden=false;msg.classList.add("is-changing");sub.classList.add("is-changing");window.setTimeout(()=>{if(!current)return;msg.textContent=item[0];sub.textContent=item[1];requestAnimationFrame(()=>requestAnimationFrame(()=>{msg.classList.remove("is-changing");sub.classList.remove("is-changing")}));},170);itemStartedAt=Date.now();lastCategory=item[2];depthCopy.textContent=deeper[current.key][index];if(!shown.includes(index))shown.push(index)}
function next(){if(!current)return;learnFromVisit();index=chooseNext();drawVideo(current.key);render()}
function skipUnavailableVideo(key,token){
  if(token!==videoLoadToken||!current||current.key!==key)return;
  if(videoLoadTimer){clearTimeout(videoLoadTimer);videoLoadTimer=null;}
  failedVideoAttempts[key]=(failedVideoAttempts[key]||0)+1;
  if(failedVideoAttempts[key]<data[key].videos.length){
    drawVideo(key);
  }else{
    video.classList.remove("is-loading");
    
  }
}
async function resolvePlayableVideo(url){
  const file=decodeURIComponent(url.substring(url.lastIndexOf("/")+1));
  const api=new URL("https://commons.wikimedia.org/w/api.php");
  api.search=new URLSearchParams({action:"query",titles:"File:"+file,prop:"videoinfo",viprop:"derivatives",format:"json",origin:"*"}).toString();
  try{
    const response=await fetch(api.toString(),{mode:"cors"});
    if(!response.ok)throw new Error("Commons API unavailable");
    const json=await response.json();
    const page=Object.values(json.query.pages)[0];
    const derivatives=page&&page.videoinfo&&page.videoinfo[0]&&page.videoinfo[0].derivatives||[];
    const preferred=["480p.vp9.webm","360p.vp9.webm","240p.vp9.webm","480p.webm","360p.webm","240p.webm"];
    for(const key of preferred){
      const source=derivatives.find(item=>item.transcodekey===key&&item.src);
      if(source)return source.src;
    }
  }catch(e){}
  return url;
}
async function drawVideo(key){
  if(videoLoadTimer){clearTimeout(videoLoadTimer);videoLoadTimer=null;}
  const token=++videoLoadToken;
  const list=data[key].videos;
  let deck=videoDecks[key];
  if(!deck||deck.length===0){
    deck=list.map((url,i)=>i);
  }
  const chosen=deck.shift();
  videoDecks[key]=deck;
  lastVideoBySpace[key]=chosen;
  const originalUrl=list[chosen];
  const file=decodeURIComponent(originalUrl.substring(originalUrl.lastIndexOf("/")+1));
  video.classList.add("is-loading");
  video.pause();
  video.removeAttribute("src");
  video.load();
  videoLoadTimer=setTimeout(()=>skipUnavailableVideo(key,token),22000);
  const playableUrl=await resolvePlayableVideo(originalUrl);
  if(token!==videoLoadToken||!current||current.key!==key)return;
  video.src=playableUrl;
  video.load();
  const playResult=video.play();
  if(playResult&&typeof playResult.catch==="function")playResult.catch(()=>{});
}
function openSpace(key){current={...data[key],key};failedVideoAttempts[key]=0;depthPanel.classList.remove("visible");index=0;shown=[];lastCategory=null;scene.style.setProperty("--scene",current.scene);scene.style.setProperty("--orb",current.orb);drawVideo(key);home.classList.remove("active");feed.classList.add("active");feed.classList.remove("immersive");render();}
function goHome(){learnFromVisit();depthPanel.classList.remove("visible");stopAtmosphere();feed.classList.remove("active","immersive");home.classList.add("active");video.pause();current=null;msg.classList.remove("is-changing");sub.classList.remove("is-changing")}
video.addEventListener("loadeddata",()=>{if(videoLoadTimer){clearTimeout(videoLoadTimer);videoLoadTimer=null;}if(current)failedVideoAttempts[current.key]=0;video.classList.remove("is-loading");});video.addEventListener("playing",()=>video.classList.remove("is-loading"));video.addEventListener("error",()=>{const token=videoLoadToken;if(current&&video.currentSrc===video.src)skipUnavailableVideo(current.key,token);});
let audioContext=null,ambientGain=null,ambientEnabled=false,spaceSoundNodes=[];
function setSoundButton(){soundButton.setAttribute("aria-pressed",String(ambientEnabled));soundButton.setAttribute("aria-label",ambientEnabled?"Выключить звук атмосферы":"Включить звук атмосферы");soundButton.title=ambientEnabled?"Звук включён":"Звук выключен";soundButton.textContent=ambientEnabled?"◖))":"◖)";}
function getAudioContext(){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return null;audioContext=audioContext||new AudioCtx();return audioContext}
function stopSpaceSound(){for(const node of spaceSoundNodes){try{if(node.stop)node.stop()}catch(e){}try{if(node.disconnect)node.disconnect()}catch(e){}}spaceSoundNodes=[]}
function buildSpaceSound(key){const ctx=getAudioContext();if(!ctx||!ambientGain)return;stopSpaceSound();
const makeNoise=(type,frequency,q,level)=>{const length=ctx.sampleRate*4,buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);let brown=0;for(let i=0;i<length;i++){const white=Math.random()*2-1;brown=(brown+.035*white)/1.035;data[i]=type==="brown"?brown*3.6:white*.55;}const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=buffer;source.loop=true;filter.type=type==="rain"?"highpass":type==="surf"?"lowpass":"bandpass";filter.frequency.value=frequency;filter.Q.value=q;gain.gain.value=level;source.connect(filter);filter.connect(gain);gain.connect(ambientGain);source.start();spaceSoundNodes.push(source,filter,gain);return gain};
const makeTone=(frequency,level,wave="sine",detune=0)=>{const osc=ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();osc.type=wave;osc.frequency.value=frequency;osc.detune.value=detune;filter.type="lowpass";filter.frequency.value=Math.max(100,frequency*2.5);gain.gain.value=level;osc.connect(filter);filter.connect(gain);gain.connect(ambientGain);osc.start();spaceSoundNodes.push(osc,filter,gain);return gain};
const modulate=(target,rate,depth)=>{const lfo=ctx.createOscillator(),amount=ctx.createGain();lfo.frequency.value=rate;amount.gain.value=depth;lfo.connect(amount);amount.connect(target.gain);lfo.start();spaceSoundNodes.push(lfo,amount)};
if(key==="anxiety"){
const wind=makeNoise("brown",260,.22,.20);modulate(wind,.075,.12);const gust=makeNoise("brown",115,.18,.075);modulate(gust,.035,.05);makeTone(49,.018,"sine");
}else if(key==="emptiness"){
const surf=makeNoise("surf",680,.18,.12);modulate(surf,.105,.105);const foam=makeNoise("surf",1450,.12,.035);modulate(foam,.105,.03);makeTone(73,.012,"sine");
}else if(key==="loneliness"){
makeNoise("rain",1250,.7,.065);makeNoise("rain",3600,.9,.022);for(let i=0;i<3;i++){const drop=makeTone(1450+i*390,.0015,"sine");modulate(drop,.23+i*.07,.0012);}
}else if(key==="sadness"){
makeTone(110,.022,"sine");makeTone(164.81,.012,"sine",3);makeTone(220,.006,"sine",-4);const air=makeNoise("brown",390,.2,.025);modulate(air,.025,.018);
}else{
makeNoise("brown",260,.22,.18);
}}
function enableAtmosphere(){const ctx=getAudioContext();if(!ctx)return false;ambientGain=ambientGain||ctx.createGain();if(!ambientGain.__connected){ambientGain.gain.value=0;ambientGain.connect(ctx.destination);ambientGain.__connected=true;}return true}
async function toggleAtmosphere(){if(!ambientEnabled){if(!enableAtmosphere()){soundButton.title="Звук не поддерживается этим браузером";return;}try{await audioContext.resume();}catch(e){soundButton.title="Не удалось включить звук";return;}ambientEnabled=true;buildSpaceSound(current&&current.key);ambientGain.gain.cancelScheduledValues(audioContext.currentTime);ambientGain.gain.setTargetAtTime(.2,audioContext.currentTime,.25);}else{ambientEnabled=false;ambientGain.gain.cancelScheduledValues(audioContext.currentTime);ambientGain.gain.setTargetAtTime(0,audioContext.currentTime,.18);setTimeout(stopSpaceSound,900);}setSoundButton()}
function stopAtmosphere(){if(!ambientEnabled)return;ambientEnabled=false;if(audioContext&&ambientGain){ambientGain.gain.cancelScheduledValues(audioContext.currentTime);ambientGain.gain.setTargetAtTime(0,audioContext.currentTime,.12);setTimeout(stopSpaceSound,700);}setSoundButton()}
soundButton.addEventListener("click",toggleAtmosphere);setSoundButton();

depthClose.addEventListener("click",()=>{depthPanel.classList.remove("visible");});
depthYes.addEventListener("click",()=>{if(current){const all=readAdaptation(),scores=all[current.key]||{presence:0,support:0,reflection:0},kind=current.items[index][2];scores[kind]=Math.min(2.5,(scores[kind]||0)+.25);all[current.key]=scores;writeAdaptation(all);}depthCopy.textContent="Спасибо, что прислушался к себе. Можно ничего не менять и не делать.";depthYes.hidden=true;});

document.querySelectorAll("[data-space]").forEach(b=>b.addEventListener("click",()=>openSpace(b.dataset.space)));
document.querySelector("#back").addEventListener("click",goHome);
feed.addEventListener("touchstart",e=>startY=e.changedTouches[0].clientY,{passive:true});
feed.addEventListener("touchend",e=>{let dy=startY-e.changedTouches[0].clientY;if(dy>50)next()},{passive:true});
feed.addEventListener("wheel",e=>{if(e.deltaY>20)next()},{passive:true});
feed.addEventListener("click",e=>{if(e.target.closest("button"))return;let now=Date.now();if(now-lastTap<330){depthPanel.classList.toggle("visible");lastTap=0}else lastTap=now});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&feed.classList.contains("active")){if(feed.classList.contains("immersive"))feed.classList.remove("immersive");else goHome()}if(e.key==="ArrowUp")next()});
</script></body></html>
