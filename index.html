<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12">
<title>ТИШЕ</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#edf0f5;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button{font:inherit;color:inherit}.screen{position:fixed;inset:0;display:none;overflow:hidden}.screen.active{display:flex}#home{align-items:center;justify-content:center;padding:32px 22px;background:radial-gradient(ellipse at 50% 12%,#202735,#10131b 48%,#090b10)}.home-inner{width:min(100%,560px)}.eyebrow{font-size:10px;letter-spacing:.28em;color:#8e95a5;text-transform:uppercase;margin-bottom:22px}.brand{font-size:clamp(52px,14vw,78px);font-weight:300;letter-spacing:.18em;margin:0 0 12px}.intro{font-size:15px;line-height:1.65;color:#9ca3b1;margin:0 0 42px}.spaces{display:grid;grid-template-columns:1fr 1fr;gap:12px}.space{min-height:140px;border:1px solid #ffffff18;border-radius:18px;background:linear-gradient(145deg,#ffffff10,#ffffff03);text-align:left;padding:20px;cursor:pointer;position:relative;overflow:hidden}.space:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-45px;bottom:-55px;background:var(--glow);filter:blur(27px);opacity:.4}.space-name,.space-note{display:block;position:relative;z-index:1}.space-name{font-size:18px;margin-bottom:9px}.space-note{font-size:12px;line-height:1.5;color:#9299a7}.home-foot{margin-top:30px;color:#666e7d;font-size:10px;letter-spacing:.1em}#feed{justify-content:center;align-items:stretch;background:#0b0d12}.scene{position:absolute;inset:0;background:var(--scene);transition:transform .7s,filter .7s}.scene-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.66;filter:brightness(.62) saturate(.78);transition:opacity .8s}.scene-video.is-loading{opacity:0}.orb{position:absolute;width:min(65vw,500px);aspect-ratio:1;border-radius:50%;left:50%;top:43%;transform:translate(-50%,-50%);background:var(--orb);filter:blur(70px);opacity:.27;animation:breathe 9s ease-in-out infinite alternate}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#080a10a8,transparent 30%,#080a1070 68%,#080a10)}@keyframes breathe{to{transform:translate(-45%,-46%) scale(1.15);opacity:.48}}.topbar{position:absolute;z-index:3;top:env(safe-area-inset-top,0);left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:center}.back,.sound-toggle{border:0;background:transparent;border-radius:0;padding:8px;font-size:19px;font-weight:300;line-height:1;color:#d0d5df;opacity:.72;cursor:pointer}.sound-toggle{font-size:15px;opacity:.58;transition:opacity .25s,color .25s}.sound-toggle[aria-pressed="true"]{opacity:.95;color:#e5eaf3}.content{position:relative;z-index:2;margin:0;width:min(100%,680px);height:100%;min-height:100%;padding:0 18px calc(28px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;text-align:left;transition:transform .5s}.counter{font-size:7px;letter-spacing:.18em;color:#858d9b;margin-bottom:9px}.message{font-size:clamp(16px,4vw,21px);font-weight:300;line-height:1.35;letter-spacing:-.02em;max-width:390px;text-wrap:balance;opacity:1;transform:translateY(0);transition:opacity .48s ease,transform .58s cubic-bezier(.2,.7,.2,1)}.message.is-changing{opacity:0;transform:translateY(9px)}.submessage{font-size:9px;line-height:1.55;color:#969eac;margin-top:8px;max-width:270px;opacity:1;transform:translateY(0);transition:opacity .48s ease .035s,transform .58s cubic-bezier(.2,.7,.2,1)}.submessage.is-changing{opacity:0;transform:translateY(7px)}#feed.immersive .scene{transform:scale(1.04);filter:saturate(1.2)}#feed.immersive .topbar{opacity:0}#feed.immersive .content{transform:scale(1.035)}.topbar{transition:opacity .5s}@media(max-width:390px){.space{min-height:126px;padding:16px}.brand{font-size:55px}.intro{margin-bottom:34px}}
</style></head>
<body>
<main id="home" class="screen active"><div class="home-inner"><div class="eyebrow">место, где можно быть</div><h1 class="brand">ТИШЕ</h1><p class="intro">Не нужно ничего объяснять.<br>Выбери то, что ближе сейчас.</p><div class="spaces">
<button class="space" style="--glow:#7b8da9" data-space="anxiety"><span class="space-name">Тревога</span><span class="space-note">Когда внутри слишком громко</span></button>
<button class="space" style="--glow:#596c89" data-space="emptiness"><span class="space-name">Пустота</span><span class="space-note">Когда ничего не чувствуется</span></button>
<button class="space" style="--glow:#967b9d" data-space="loneliness"><span class="space-name">Одиночество</span><span class="space-note">Когда хочется чьего-то присутствия</span></button>
<button class="space" style="--glow:#9b7770" data-space="sadness"><span class="space-name">Грусть</span><span class="space-note">Когда можно не торопиться</span></button></div><div class="home-foot">БЕЗ ОЦЕНОК · БЕЗ СПЕШКИ · БЕЗ ОБЯЗАТЕЛЬСТВ</div></div></main>
<section id="feed" class="screen" aria-live="polite"><div class="scene" id="scene"><video class="scene-video is-loading" id="scene-video" muted playsinline loop autoplay preload="none"></video><div class="orb"></div></div><header class="topbar"><button class="back" id="back" aria-label="На главный экран" title="На главный экран">←</button><button class="sound-toggle" id="sound-toggle" type="button" aria-label="Включить звук атмосферы" aria-pressed="false" title="Звук выключен">◖))</button></header><div class="content"><div class="message" id="message"></div><div class="submessage" id="submessage"></div></div></section>
<script>
const data={
anxiety:{name:"ТРЕВОГА",video:"https://commons.wikimedia.org/wiki/Special:FilePath/Storm_clouds,_Chicago.webm",scene:"radial-gradient(ellipse at 50% 42%,#344256,#1a2635 48%,#090d15)",orb:"#91a9c9",items:[
["Сейчас не обязательно находить решение.","Можно на время отложить всё, что требует ответа.","presence"],
["Если хочется, почувствуй опору под ногами.","Заметь поверхность, которая тебя держит. Не нужно менять дыхание или добиваться спокойствия.","support"],
["Что именно сейчас просит твоего внимания?","Не ищи правильный ответ. Может быть, это задача, разговор, усталость — или что-то совсем другое.","reflection"],
["Тревожные мысли могут звучать убедительно.","Но мысль — это ещё не событие. Можно заметить её и не решать прямо сейчас, верить ей или спорить с ней.","presence"],
["Найди взглядом три спокойные детали вокруг.","Цвет, форму, пятно света. Останься с ними столько, сколько комфортно.","support"],
["Есть ли что-то маленькое, что сейчас зависит от тебя?","Не вся ситуация целиком — только один посильный следующий шаг. И можно пока не делать даже его.","reflection"],
["Тебе не нужно быть собранным каждую минуту.","Можно устать от собственной настороженности. Здесь не нужно держать лицо.","presence"],
["Попробуй чуть отпустить плечи, если это приятно.","Или просто устройся удобнее. Ничего не должно получиться идеально.","support"],
["Чего тебе сейчас не хватает больше всего?","Ясности, времени, помощи, отдыха, ощущения безопасности? Можно просто заметить ответ.","reflection"]
]},
emptiness:{name:"ПУСТОТА",video:"https://commons.wikimedia.org/wiki/Special:FilePath/Waves_of_the_sea_(Video).webm",scene:"radial-gradient(ellipse at 50% 45%,#343b49,#1a202b 48%,#090c12)",orb:"#8592a9",items:[
["Необязательно прямо сейчас что-то чувствовать.","Не нужно заполнять паузу словами или искать в ней скрытый смысл.","presence"],
["Заметь одну простую вещь вокруг, которая тебе нейтральна или приятна.","Свет на стене, ткань под рукой, звук за окном. Можно ничего не объяснять себе.","support"],
["Когда в последний раз тебе было хоть немного интересно?","Не обязательно радостно. Может быть, спокойно, любопытно или просто чуть легче.","reflection"],
["Можно не торопиться возвращать себе прежние ощущения.","Сейчас ты можешь быть именно таким, каким оказался в этот момент.","presence"],
["Если есть силы, выбери что-то простое для тела.","Выпить воды, открыть окно, укрыться пледом или немного пройтись. Только если это подходит тебе сейчас.","support"],
["Пустота больше похожа на усталость, паузу или отсутствие чего-то важного?","Можно не выбирать ни один вариант. Вопрос нужен не для диагноза, а чтобы прислушаться к себе.","reflection"],
["Не каждый день обязан быть наполненным.","Некоторые дни проходят почти бесшумно. Им тоже есть место.","presence"],
["Попробуй на мгновение заметить контакт тела с опорой.","Спинка кресла, пол под ногами, поверхность кровати. Не нужно ничего чувствовать особенным образом.","support"],
["Чего тебе хотелось бы добавить в свою жизнь совсем понемногу?","Не большую цель — маленькую деталь, которую можно было бы впустить без обязательств.","reflection"]
]},
loneliness:{name:"ОДИНОЧЕСТВО",video:"https://commons.wikimedia.org/wiki/Special:FilePath/Raindrops_against_the_window_in_the_night_city,_Las_Palmas.webm",scene:"radial-gradient(ellipse at 50% 43%,#493c52,#241e2d 48%,#0c0b12)",orb:"#b09ab8",items:[
["Можно хотеть, чтобы кто-то был рядом.","В этом желании нет ничего, за что нужно себя осуждать.","presence"],
["Если захочется, вспомни человека, рядом с которым можно быть собой.","Не обязательно писать ему прямо сейчас. Достаточно заметить, кто приходит на ум.","support"],
["По какой близости ты скучаешь?","По разговору, молчанию рядом, прикосновению, общему делу или ощущению, что тебя помнят?","reflection"],
["Даже среди людей можно чувствовать себя отдельно.","Тебе не нужно доказывать, что твоё одиночество достаточно серьёзное.","presence"],
["Можно сделать небольшой шаг к контакту — если он тебе сейчас подходит.","Отправить короткое сообщение, договориться о прогулке или просто побыть там, где есть другие люди.","support"],
["Где тебе легче быть настоящим человеком, а не удобной версией себя?","Вспомни место, занятие или отношения. Что в них создаёт это ощущение?","reflection"],
["Ты достоин близости не за достижения и не за удобство.","Не нужно сначала стать кем-то другим, чтобы заслужить человеческое тепло.","presence"],
["Подумай, какой контакт был бы посильным сегодня.","Не самый смелый и не самый правильный — просто тот, на который у тебя есть силы.","support"],
["Что помогает тебе чувствовать связь с миром?","Люди, музыка, животные, знакомые места, общие интересы — у каждого это может быть своим.","reflection"]
]},
sadness:{name:"ГРУСТЬ",video:"https://commons.wikimedia.org/wiki/Special:FilePath/Clouds_transformation.webm",scene:"radial-gradient(ellipse at 50% 44%,#514047,#292027 48%,#0d0b10)",orb:"#b18c88",items:[
["Не нужно торопить себя через грусть.","Можно не превращать это чувство в задачу, которую надо срочно решить.","presence"],
["Попробуй выбрать для себя немного больше мягкости.","Тёплый напиток, удобное место, пауза или разговор — то, что сейчас действительно подходит.","support"],
["О чём может говорить эта грусть — если вообще что-то говорит?","О потере, перемене, усталости, несбывшемся ожидании? Необязательно находить объяснение.","reflection"],
["Сегодня можно быть не таким, как обычно.","Тебе не нужно всё время держаться или делать вид, что ничего не происходит.","presence"],
["Если хочется, назови про себя то, что чувствуешь.","Одним словом или несколькими. А если слов нет — это тоже нормально.","support"],
["Что тебе хотелось бы получить от себя в этот период?","Больше терпения, отдыха, честности, заботы или разрешения не спешить?","reflection"],
["Не всякую боль можно сделать меньше одной мыслью.","Иногда достаточно не оставаться с ней в одиночестве и дать себе время.","presence"],
["Вспомни, что обычно приносит тебе хотя бы немного облегчения.","Не обязательно радость. Может быть, музыка, прогулка, знакомый голос или тишина.","support"],
["Если бы близкий человек переживал то же самое, что бы ты хотел ему сказать?","Есть ли в этих словах что-то, что можно бережно адресовать и себе?","reflection"]
]}};
let current=null,index=0,startY=0,lastTap=0,shown=[],itemStartedAt=0,lastCategory=null;
const home=document.querySelector("#home"),feed=document.querySelector("#feed"),scene=document.querySelector("#scene"),video=document.querySelector("#scene-video"),msg=document.querySelector("#message"),sub=document.querySelector("#submessage"),soundButton=document.querySelector("#sound-toggle");
const ADAPT_KEY="tishe_content_rhythm_v1";
function readAdaptation(){try{return JSON.parse(localStorage.getItem(ADAPT_KEY)||"{}")}catch(e){return {}}}
function writeAdaptation(value){try{localStorage.setItem(ADAPT_KEY,JSON.stringify(value))}catch(e){}}
function categoryScores(key){const all=readAdaptation();return all[key]||{presence:0,support:0,reflection:0}}
function learnFromVisit(){if(!current||!itemStartedAt)return;const item=current.items[index],elapsed=(Date.now()-itemStartedAt)/1000,category=item[2];if(!category)return;const all=readAdaptation(),scores=all[current.key]||{presence:0,support:0,reflection:0};let delta=elapsed>=14?0.45:elapsed>=7?0.15:elapsed<3?-0.08:0;scores[category]=Math.max(-1.5,Math.min(2.5,(scores[category]||0)+delta));all[current.key]=scores;writeAdaptation(all);itemStartedAt=0}
function chooseNext(){const remaining=current.items.map((item,i)=>({item,i})).filter(x=>!shown.includes(x.i));if(!remaining.length){shown=[];return chooseNext()}const scores=categoryScores(current.key);remaining.sort((a,b)=>{const score=x=>(scores[x.item[2]]||0)+(x.item[2]===lastCategory?-0.55:0)-(x.i/1000);return score(b)-score(a)});return remaining[0].i}
function render(){const item=current.items[index];msg.classList.add("is-changing");sub.classList.add("is-changing");window.setTimeout(()=>{if(!current)return;msg.textContent=item[0];sub.textContent=item[1];requestAnimationFrame(()=>requestAnimationFrame(()=>{msg.classList.remove("is-changing");sub.classList.remove("is-changing")}));},170);itemStartedAt=Date.now();lastCategory=item[2];if(!shown.includes(index))shown.push(index)}
function next(){if(!current)return;learnFromVisit();index=chooseNext();render()}
function openSpace(key){current={...data[key],key};index=0;shown=[];lastCategory=null;scene.style.setProperty("--scene",current.scene);scene.style.setProperty("--orb",current.orb);video.classList.add("is-loading");video.pause();video.src=current.video;video.load();video.play().catch(()=>{});home.classList.remove("active");feed.classList.add("active");feed.classList.remove("immersive");render();}
function goHome(){learnFromVisit();feed.classList.remove("active","immersive");home.classList.add("active");video.pause();current=null;msg.classList.remove("is-changing");sub.classList.remove("is-changing")}
video.addEventListener("playing",()=>video.classList.remove("is-loading"));video.addEventListener("error",()=>video.classList.add("is-loading"));
let audioContext=null,ambientGain=null,noiseGain=null,ambientEnabled=false;
function setSoundButton(){soundButton.setAttribute("aria-pressed",String(ambientEnabled));soundButton.setAttribute("aria-label",ambientEnabled?"Выключить звук атмосферы":"Включить звук атмосферы");soundButton.title=ambientEnabled?"Звук включён":"Звук выключен";soundButton.textContent=ambientEnabled?"◖))":"◖)";}
function createAtmosphere(){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return false;audioContext=audioContext||new AudioCtx();if(audioContext.state==="suspended")audioContext.resume();if(!ambientGain){const master=audioContext.createGain();master.gain.value=0;master.connect(audioContext.destination);ambientGain=master;const length=audioContext.sampleRate*4,buffer=audioContext.createBuffer(1,length,audioContext.sampleRate),channel=buffer.getChannelData(0);let last=0;for(let i=0;i<length;i++){const white=Math.random()*2-1;last=(last+0.018*white)/1.018;channel[i]=last*3.4;}const noise=audioContext.createBufferSource();noise.buffer=buffer;noise.loop=true;const low=audioContext.createBiquadFilter();low.type="lowpass";low.frequency.value=520;low.Q.value=.35;const high=audioContext.createBiquadFilter();high.type="highpass";high.frequency.value=85;noiseGain=audioContext.createGain();noiseGain.gain.value=.7;noise.connect(low);low.connect(high);high.connect(noiseGain);noiseGain.connect(master);noise.start();const tone=audioContext.createOscillator(),toneFilter=audioContext.createBiquadFilter(),toneGain=audioContext.createGain();tone.type="sine";tone.frequency.value=92;toneFilter.type="lowpass";toneFilter.frequency.value=150;toneGain.gain.value=.12;tone.connect(toneFilter);toneFilter.connect(toneGain);toneGain.connect(master);tone.start();}return true}
function toggleAtmosphere(){if(!ambientEnabled){if(!createAtmosphere())return;ambientEnabled=true;ambientGain.gain.cancelScheduledValues(audioContext.currentTime);ambientGain.gain.setTargetAtTime(.045,audioContext.currentTime,.9);}else{ambientEnabled=false;ambientGain.gain.cancelScheduledValues(audioContext.currentTime);ambientGain.gain.setTargetAtTime(0,audioContext.currentTime,.35);}setSoundButton()}
soundButton.addEventListener("click",toggleAtmosphere);setSoundButton();
document.querySelectorAll("[data-space]").forEach(b=>b.addEventListener("click",()=>openSpace(b.dataset.space)));
document.querySelector("#back").addEventListener("click",goHome);
feed.addEventListener("touchstart",e=>startY=e.changedTouches[0].clientY,{passive:true});
feed.addEventListener("touchend",e=>{let dy=startY-e.changedTouches[0].clientY;if(dy>50)next()},{passive:true});
feed.addEventListener("wheel",e=>{if(e.deltaY>20)next()},{passive:true});
feed.addEventListener("click",e=>{if(e.target.closest("button"))return;let now=Date.now();if(now-lastTap<330){feed.classList.toggle("immersive");lastTap=0}else lastTap=now});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&feed.classList.contains("active")){if(feed.classList.contains("immersive"))feed.classList.remove("immersive");else goHome()}if(e.key==="ArrowUp")next()});
</script></body></html>
