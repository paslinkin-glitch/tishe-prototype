<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12">
<title>ТИШЕ</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#edf0f5;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button{font:inherit;color:inherit}.screen{position:fixed;inset:0;display:none;overflow:hidden}.screen.active{display:flex}#home{align-items:center;justify-content:center;padding:32px 22px;background:radial-gradient(ellipse at 50% 12%,#202735,#10131b 48%,#090b10)}.home-inner{width:min(100%,560px)}.eyebrow{font-size:10px;letter-spacing:.28em;color:#8e95a5;text-transform:uppercase;margin-bottom:22px}.brand{font-size:clamp(52px,14vw,78px);font-weight:300;letter-spacing:.18em;margin:0 0 12px}.intro{font-size:15px;line-height:1.65;color:#9ca3b1;margin:0 0 42px}.spaces{display:grid;grid-template-columns:1fr 1fr;gap:12px}.space{min-height:140px;border:1px solid #ffffff18;border-radius:18px;background:linear-gradient(145deg,#ffffff10,#ffffff03);text-align:left;padding:20px;cursor:pointer;position:relative;overflow:hidden}.space:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-45px;bottom:-55px;background:var(--glow);filter:blur(27px);opacity:.4}.space-name,.space-note{display:block;position:relative;z-index:1}.space-name{font-size:18px;margin-bottom:9px}.space-note{font-size:12px;line-height:1.5;color:#9299a7}.home-foot{margin-top:30px;color:#666e7d;font-size:10px;letter-spacing:.1em}#feed{justify-content:center;align-items:stretch;background:#0b0d12}.scene{position:absolute;inset:0;background:var(--scene);transition:transform .7s,filter .7s}.orb{position:absolute;width:min(65vw,500px);aspect-ratio:1;border-radius:50%;left:50%;top:43%;transform:translate(-50%,-50%);background:var(--orb);filter:blur(70px);opacity:.27;animation:breathe 9s ease-in-out infinite alternate}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#080a10a8,transparent 30%,#080a1070 68%,#080a10)}@keyframes breathe{to{transform:translate(-45%,-46%) scale(1.15);opacity:.48}}.topbar{position:absolute;z-index:3;top:env(safe-area-inset-top,0);left:0;right:0;padding:22px;display:flex;justify-content:space-between;align-items:center}.back{border:1px solid #ffffff20;background:#ffffff10;border-radius:30px;padding:10px 15px;font-size:12px;cursor:pointer}.feed-label{font-size:10px;letter-spacing:.22em;color:#a4aab7}.content{position:relative;z-index:2;margin:auto;width:min(100%,680px);padding:90px 28px;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .5s}.counter{font-size:10px;letter-spacing:.24em;color:#a0a7b5;margin-bottom:34px}.message{font-size:clamp(28px,7vw,48px);font-weight:300;line-height:1.28;letter-spacing:-.025em;max-width:570px;text-wrap:balance}.submessage{font-size:13px;line-height:1.7;color:#aeb4c0;margin-top:24px;max-width:330px}.hint{position:absolute;z-index:3;bottom:calc(24px + env(safe-area-inset-bottom,0));left:0;right:0;text-align:center;color:#7f8795;font-size:10px;letter-spacing:.1em}.hint b{font-weight:400;color:#c2c7d0}#feed.immersive .scene{transform:scale(1.04);filter:saturate(1.2)}#feed.immersive .topbar,#feed.immersive .hint{opacity:0}#feed.immersive .content{transform:scale(1.035)}.topbar,.hint{transition:opacity .5s}@media(max-width:390px){.space{min-height:126px;padding:16px}.brand{font-size:55px}.intro{margin-bottom:34px}}
</style></head>
<body>
<main id="home" class="screen active"><div class="home-inner"><div class="eyebrow">место, где можно быть</div><h1 class="brand">ТИШЕ</h1><p class="intro">Не нужно ничего объяснять.<br>Выбери то, что ближе сейчас.</p><div class="spaces">
<button class="space" style="--glow:#7b8da9" data-space="anxiety"><span class="space-name">Тревога</span><span class="space-note">Когда внутри слишком громко</span></button>
<button class="space" style="--glow:#596c89" data-space="emptiness"><span class="space-name">Пустота</span><span class="space-note">Когда ничего не чувствуется</span></button>
<button class="space" style="--glow:#967b9d" data-space="loneliness"><span class="space-name">Одиночество</span><span class="space-note">Когда хочется чьего-то присутствия</span></button>
<button class="space" style="--glow:#9b7770" data-space="sadness"><span class="space-name">Грусть</span><span class="space-note">Когда можно не торопиться</span></button></div><div class="home-foot">БЕЗ ОЦЕНОК · БЕЗ СПЕШКИ · БЕЗ ОБЯЗАТЕЛЬСТВ</div></div></main>
<section id="feed" class="screen" aria-live="polite"><div class="scene" id="scene"><div class="orb"></div></div><header class="topbar"><button class="back" id="back">← Пространства</button><div class="feed-label" id="feed-label">ТИШЕ</div></header><div class="content"><div class="counter" id="counter">01 / 04</div><div class="message" id="message"></div><div class="submessage" id="submessage"></div></div><div class="hint"><b>Свайп вверх</b> — дальше&nbsp; · &nbsp;<b>Двойное касание</b> — погрузиться</div></section>
<script>
const data={
anxiety:{name:"ТРЕВОГА",scene:"radial-gradient(ellipse at 50% 42%,#344256,#1a2635 48%,#090d15)",orb:"#91a9c9",items:[["Можно не решать всё прямо сейчас.","Пусть этот момент будет просто одним моментом."],["Почувствуй опору под собой.","Пол не ждёт от тебя ничего. Он просто держит."],["Мысли могут шуметь. Ты можешь не идти за каждой.","Не обязательно отвечать на всё, что возникает внутри."],["Сейчас достаточно просто быть здесь.","Один вдох. Потом ещё один. Этого достаточно."]]},
emptiness:{name:"ПУСТОТА",scene:"radial-gradient(ellipse at 50% 45%,#343b49,#1a202b 48%,#090c12)",orb:"#8592a9",items:[["Необязательно что-то чувствовать.","Пустота тоже может быть местом, где можно передохнуть."],["Ничего не нужно из себя доставать.","Побудь здесь столько, сколько хочется."],["Даже тихое присутствие — уже не ничто.","Не нужно превращать этот момент во что-то другое."],["Можно оставить всё как есть.","Сегодня не обязательно искать ответы."]]},
loneliness:{name:"ОДИНОЧЕСТВО",scene:"radial-gradient(ellipse at 50% 43%,#493c52,#241e2d 48%,#0c0b12)",orb:"#b09ab8",items:[["Ты не обязан справляться красиво.","Можно скучать. Можно хотеть, чтобы кто-то был рядом."],["Представь свет в окне напротив.","Где-то тоже кто-то проживает свой вечер."],["Не нужно заслуживать чьё-то тепло.","Ты достоин близости просто потому, что ты есть."],["Пусть эта тишина немного побудет с тобой.","Ты не должен заполнять её прямо сейчас."]]},
sadness:{name:"ГРУСТЬ",scene:"radial-gradient(ellipse at 50% 44%,#514047,#292027 48%,#0d0b10)",orb:"#b18c88",items:[["Не нужно торопить себя.","У грусти свой темп. Можно не ускорять его."],["Сегодня можно быть не таким, как обычно.","Тебе не нужно всё время держаться."],["Пусть чувство просто пройдёт сквозь тебя.","Не нужно спорить с ним или объяснять его."],["Даже этот день однажды станет воспоминанием.","А пока — побудь к себе немного мягче."]]}};
let current=null,index=0,startY=0,lastTap=0;
const home=document.querySelector("#home"),feed=document.querySelector("#feed"),scene=document.querySelector("#scene"),msg=document.querySelector("#message"),sub=document.querySelector("#submessage"),counter=document.querySelector("#counter"),label=document.querySelector("#feed-label");
function render(){let item=current.items[index];counter.textContent=String(index+1).padStart(2,"0")+" / "+String(current.items.length).padStart(2,"0");msg.textContent=item[0];sub.textContent=item[1]}
function next(){if(!current)return;index=(index+1)%current.items.length;render()}
function openSpace(key){current=data[key];index=0;label.textContent=current.name;scene.style.setProperty("--scene",current.scene);scene.style.setProperty("--orb",current.orb);home.classList.remove("active");feed.classList.add("active");feed.classList.remove("immersive");render()}
function goHome(){feed.classList.remove("active","immersive");home.classList.add("active");current=null}
document.querySelectorAll("[data-space]").forEach(b=>b.addEventListener("click",()=>openSpace(b.dataset.space)));
document.querySelector("#back").addEventListener("click",goHome);
feed.addEventListener("touchstart",e=>startY=e.changedTouches[0].clientY,{passive:true});
feed.addEventListener("touchend",e=>{let dy=startY-e.changedTouches[0].clientY;if(dy>50)next()},{passive:true});
feed.addEventListener("wheel",e=>{if(e.deltaY>20)next()},{passive:true});
feed.addEventListener("click",e=>{if(e.target.closest("button"))return;let now=Date.now();if(now-lastTap<330){feed.classList.toggle("immersive");lastTap=0}else lastTap=now});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&feed.classList.contains("active")){if(feed.classList.contains("immersive"))feed.classList.remove("immersive");else goHome()}if(e.key==="ArrowUp")next()});
</script></body></html>
